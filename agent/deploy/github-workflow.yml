name: Test and deploy agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "src/**"
      - "foundry.toml"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "agent/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Contracts and agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Contracts
        run: |
          forge build
          forge test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Agent
        working-directory: agent
        run: |
          npm ci
          npm run typecheck
          npm test

  deploy:
    name: Deploy to server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          AGENT_DIR: ${{ vars.AGENT_DIR || '/opt/bwpay-agent' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$AGENT_DIR' && git fetch --quiet origin && git checkout --quiet --force '$GITHUB_SHA' && bash agent/deploy/remote-deploy.sh '$GITHUB_SHA'"
