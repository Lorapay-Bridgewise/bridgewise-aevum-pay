[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Aevum testnet runs the Shanghai EVM: no Cancun opcodes (MCOPY, TSTORE, BLOBHASH)
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[fmt]
line_length = 110
